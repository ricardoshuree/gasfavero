# Para inicializar diariamente o MCP, execute: uv run start.py

project_name: mcp-erp-gasfavero    # nome distinto por instância
environment: dev
root_path: ../                 # raiz do projeto que este MCP enxerga
allowed_extensions:
  - .py
  - .tsx
  - .ts
  - .json
  - .yaml
  - .md
  - .toml
  - .example
  - .svg
  - .html
blocked_dirs:
  - node_modules
  - .git
  - .venv